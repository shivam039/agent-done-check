name: Verify completion claims

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify this commit
        run: node ./bin/agent-done-check.js --config agent-done-check.json --commit "$GITHUB_SHA"
      - name: Upload verification report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-done-check-report
          path: .agent-done-check/
          if-no-files-found: ignore
