name: Verify a caller repository with Agent Done Check

on:
  workflow_call:
    inputs:
      tool-ref:
        description: Full commit SHA or reviewed release tag for shivam039/agent-done-check.
        required: true
        type: string
      config:
        description: Path to the verification JSON in the caller repository.
        required: false
        default: agent-done-check.json
        type: string
      node-version:
        description: Node.js version used to run the verifier and checks.
        required: false
        default: '24'
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out caller commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivam039/agent-done-check
          ref: ${{ inputs.tool-ref }}
          path: .agent-done-check-tool
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Run commit-bound verification
        env:
          CONFIG_PATH: ${{ inputs.config }}
        run: node .agent-done-check-tool/bin/agent-done-check.js --config "$CONFIG_PATH" --commit "$GITHUB_SHA"
      - name: Upload verification report and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-done-check-report
          path: .agent-done-check/
          if-no-files-found: ignore
